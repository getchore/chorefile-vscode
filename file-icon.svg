<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- A file icon, not the app logo: no filled tile, because it sits in a
       column of thin monochrome glyphs and a solid square reads at twice
       their weight. The prompt fills about two thirds of the box, which is
       what the icons beside it do, so it lands at the same optical size. -->
  <g fill="none" stroke="#f97316" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7.5 9 L14.5 16 L7.5 23"/>
    <path d="M18.5 23 H25"/>
  </g>
</svg>
